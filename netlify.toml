# Push or Pay moved to Vercel 2026-08-08 (Netlify's credit-based pricing bills
# 15 credits per production deploy account-wide, caused a real outage --
# see issue #97). This site now exists solely to 301 old distributed links
# (X bio, etc.) that still point at pushorpay.netlify.app.
[build]
  publish = "public"

[[redirects]]
  from = "/*"
  to = "https://push-or-pay.vercel.app/:splat"
  status = 301
  force = true
